apiVersion: v1
kind: Service
metadata:
  name: claif-db
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: claif-db
  ports:
    - name: db-port
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
