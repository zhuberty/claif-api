global:
  namespace: claif-staging
  useContainerd: true
  image:
    repository: "docker.io/library"
    tag: "latest"
    pullPolicy: "Never"
  usePersistentStorage: true
  keycloakServerUrl: "https://keycloak-staging.claif.org"

keycloak:
  hostname: "keycloak-staging.claif.org"

claif-api:
  command: "./scripts/wait_for_db.sh claif-db:5432 && ./scripts/wait_for_keycloak.sh keycloak \
  && ./scripts/wait_for_minio.sh minio:9000 && poetry run uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1"