apiVersion: v1
kind: Service
metadata:
  name: claif-transcriber
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  selector:
    app: claif-transcriber
  ports:
    - name: transcriber-port
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}