apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-config
  namespace: {{ .Values.namespace }}
data:
  import-dev-settings.sh: |
    #!/bin/bash

    CONFIG_FILE="/tmp/kcadm.config"

    # Wait for Keycloak to start
    until curl -s http://127.0.0.1:8080 > /dev/null; do
        echo "Waiting for Keycloak to start..."
        sleep 5
    done

    echo "Keycloak is up. Proceeding with configuration."

    # Login to Keycloak
    /opt/bitnami/keycloak/bin/kcadm.sh config credentials \
        --server http://127.0.0.1:8080 \
        --realm master \
        --user "{{ .Values.keycloakAdmin }}" \
        --password "{{ .Values.keycloakAdminPassword }}" \
        --config "$CONFIG_FILE"

    # Create the realm if it doesn't exist
    /opt/bitnami/keycloak/bin/kcadm.sh create realms \
        -s realm="{{ .Values.keycloakRealm }}" \
        -s enabled=true \
        -s 'accessTokenLifespan=1800' \
        -s 'accessTokenLifespanForImplicitFlow=1800' \
        --config "$CONFIG_FILE" || true

    # Create the user with email verified and no required actions
    /opt/bitnami/keycloak/bin/kcadm.sh create users -r "{{ .Values.keycloakRealm }}" \
        -s username="{{ .Values.keycloakUserUsername }}" \
        -s firstName="{{ .Values.keycloakUserFirstName }}" \
        -s lastName="{{ .Values.keycloakUserLastName }}" \
        -s enabled=true \
        -s email="{{ .Values.keycloakUserEmail }}" \
        -s emailVerified=true \
        -s requiredActions=[] \
        --config "$CONFIG_FILE"

    # Set the user's password as non-temporary
    /opt/bitnami/keycloak/bin/kcadm.sh set-password -r "{{ .Values.keycloakRealm }}" \
        --username "{{ .Values.keycloakUserUsername }}" \
        --new-password "{{ .Values.keycloakUserPassword }}" \
        --temporary=false \
        --config "$CONFIG_FILE"

    # Create the client
    /opt/bitnami/keycloak/bin/kcadm.sh create clients -r "{{ .Values.keycloakRealm }}" \
        -s clientId="{{ .Values.keycloakClientId }}" \
        -s enabled=true \
        -s protocol="openid-connect" \
        -s 'redirectUris=["http://localhost/*"]' \
        -s 'webOrigins=["*"]' \
        -s publicClient=true \
        -s directAccessGrantsEnabled=true \
        --config "$CONFIG_FILE"
