apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: {{ .Values.global.namespace }}
data:
  import-dev-settings.sh: |
    #!/bin/bash

    CONFIG_FILE="/tmp/kcadm.config"

    # Wait for Keycloak to start
    until curl -s http://127.0.0.1:8080 > /dev/null; do
        echo "Waiting for Keycloak to start..."
        sleep 5
    done

    echo "Keycloak is up. Proceeding with configuration."

    # Login to Keycloak
    /opt/bitnami/keycloak/bin/kcadm.sh config credentials \
        --server http://127.0.0.1:8080 \
        --realm master \
        --user "$KC_BOOTSTRAP_ADMIN_USERNAME" \
        --password "$KC_BOOTSTRAP_ADMIN_PASSWORD" \
        --config "$CONFIG_FILE"

    # Check if the realm exists, create if it doesn't
    if ! /opt/bitnami/keycloak/bin/kcadm.sh get realms/"$KEYCLOAK_REALM" --config "$CONFIG_FILE" > /dev/null 2>&1; then
        echo "Creating realm: $KEYCLOAK_REALM"
        /opt/bitnami/keycloak/bin/kcadm.sh create realms \
            -s realm="$KEYCLOAK_REALM" \
            -s enabled=true \
            -s 'accessTokenLifespan=1800' \
            -s 'accessTokenLifespanForImplicitFlow=1800' \
            --config "$CONFIG_FILE"
    else
        echo "Realm $KEYCLOAK_REALM already exists."
    fi

    # Check if the user exists, create if it doesn't
    if ! /opt/bitnami/keycloak/bin/kcadm.sh get users -r "$KEYCLOAK_REALM" -q username="$KEYCLOAK_USER_USERNAME" --config "$CONFIG_FILE" | grep -q '"username"'; then
        echo "Creating user: $KEYCLOAK_USER_USERNAME"
        /opt/bitnami/keycloak/bin/kcadm.sh create users -r "$KEYCLOAK_REALM" \
            -s username="$KEYCLOAK_USER_USERNAME" \
            -s firstName="$KEYCLOAK_USER_FIRST_NAME" \
            -s lastName="$KEYCLOAK_USER_LAST_NAME" \
            -s enabled=true \
            -s email="$KEYCLOAK_USER_EMAIL" \
            -s emailVerified=true \
            -s requiredActions=[] \
            --config "$CONFIG_FILE"
        
        # Set the user's password as non-temporary
        /opt/bitnami/keycloak/bin/kcadm.sh set-password -r "$KEYCLOAK_REALM" \
            --username "$KEYCLOAK_USER_USERNAME" \
            --new-password "$KEYCLOAK_USER_PASSWORD" \
            --temporary=false \
            --config "$CONFIG_FILE"
    else
        echo "User $KEYCLOAK_USER_USERNAME already exists."
    fi

    # Check if the client exists, create if it doesn't
    if ! /opt/bitnami/keycloak/bin/kcadm.sh get clients -r "$KEYCLOAK_REALM" -q clientId="$KEYCLOAK_CLIENT_ID" --config "$CONFIG_FILE" | grep -q '"clientId"'; then
        echo "Creating client: $KEYCLOAK_CLIENT_ID"
        /opt/bitnami/keycloak/bin/kcadm.sh create clients -r "$KEYCLOAK_REALM" \
            -s clientId="$KEYCLOAK_CLIENT_ID" \
            -s enabled=true \
            -s protocol="openid-connect" \
            -s 'redirectUris=["http://localhost/*"]' \
            -s 'webOrigins=["*"]' \
            -s publicClient=true \
            -s directAccessGrantsEnabled=true \
            --config "$CONFIG_FILE"
    else
        echo "Client $KEYCLOAK_CLIENT_ID already exists."
    fi

  create-keycloak-user.sh: |
    #!/bin/bash

    # Ensure all required arguments are provided
    if [[ $# -ne 5 ]]; then
        echo "Usage: $0 <USERNAME> <FIRST_NAME> <LAST_NAME> <EMAIL> <PASSWORD>"
        exit 1
    fi

    # Extract arguments
    USERNAME=$(echo "$1" | tr '[:upper:]' '[:lower:]') # Convert to lowercase
    FIRST_NAME="$2"
    LAST_NAME="$3"
    EMAIL="$4"
    PASSWORD="$5"

    # Load environment variables already set in the Keycloak container
    CONFIG_FILE="/tmp/kcadm.config"

    # Wait for Keycloak to be up
    until curl -s http://127.0.0.1:8080 > /dev/null; do
        echo "Waiting for Keycloak to start..."
        sleep 5
    done

    echo "Keycloak is up. Proceeding with user creation."

    # Login to Keycloak
    /opt/bitnami/keycloak/bin/kcadm.sh config credentials \
        --server http://127.0.0.1:8080 \
        --realm master \
        --user "$KC_BOOTSTRAP_ADMIN_USERNAME" \
        --password "$KC_BOOTSTRAP_ADMIN_PASSWORD" \
        --config "$CONFIG_FILE"

    # Check if the user already exists
    USER_EXISTS=$(/opt/bitnami/keycloak/bin/kcadm.sh get users -r "$KEYCLOAK_REALM" \
        -q username="$USERNAME" \
        --config "$CONFIG_FILE" | grep -c "\"username\"")

    if [[ "$USER_EXISTS" -gt 0 ]]; then
        echo "User $USERNAME already exists. Skipping creation."
    else
        # Create the user
        /opt/bitnami/keycloak/bin/kcadm.sh create users -r "$KEYCLOAK_REALM" \
            -s username="$USERNAME" \
            -s firstName="$FIRST_NAME" \
            -s lastName="$LAST_NAME" \
            -s enabled=true \
            -s email="$EMAIL" \
            -s emailVerified=true \
            --config "$CONFIG_FILE"

        echo "User $USERNAME created successfully."
    fi

    # Set the user's password as non-temporary only if the user exists
    /opt/bitnami/keycloak/bin/kcadm.sh set-password -r "$KEYCLOAK_REALM" \
        --username "$USERNAME" \
        --new-password "$PASSWORD" \
        --temporary=false \
        --config "$CONFIG_FILE"

    echo "Password for $USERNAME has been set successfully."

  delete-keycloak-user.sh: |
    #!/bin/bash

    # Ensure the username is provided
    if [[ $# -ne 1 ]]; then
        echo "Usage: $0 <USERNAME>"
        exit 1
    fi

    USERNAME=$(echo "$1" | tr '[:upper:]' '[:lower:]') # Convert to lowercase

    # Load environment variables already set in the Keycloak container
    CONFIG_FILE="/tmp/kcadm.config"

    # Wait for Keycloak to be up
    until curl -s http://127.0.0.1:8080 > /dev/null; do
        echo "Waiting for Keycloak to start..."
        sleep 5
    done

    echo "Keycloak is up. Proceeding with user deletion."

    # Login to Keycloak
    /opt/bitnami/keycloak/bin/kcadm.sh config credentials \
        --server http://127.0.0.1:8080 \
        --realm master \
        --user "$KC_BOOTSTRAP_ADMIN_USERNAME" \
        --password "$KC_BOOTSTRAP_ADMIN_PASSWORD" \
        --config "$CONFIG_FILE"

    # Get the user ID
    USER_JSON=$(/opt/bitnami/keycloak/bin/kcadm.sh get users -r "$KEYCLOAK_REALM" \
        -q username="$USERNAME" \
        --config "$CONFIG_FILE")

    USER_ID=$(echo "$USER_JSON" | grep -o '"id"[[:space:]]*:[[:space:]]*"[a-f0-9-]*"' | head -n1 | sed 's/.*"id"[[:space:]]*:[[:space:]]*"\([a-f0-9-]*\)".*/\1/')

    if [[ -z "$USER_ID" ]]; then
        echo "User $USERNAME not found."
        exit 1
    fi

    # Delete the user
    /opt/bitnami/keycloak/bin/kcadm.sh delete users/"$USER_ID" -r "$KEYCLOAK_REALM" \
        --config "$CONFIG_FILE"

    echo "User $USERNAME deleted successfully."