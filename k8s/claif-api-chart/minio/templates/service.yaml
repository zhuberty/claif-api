apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: minio
  ports:
    - name: http
      protocol: TCP
      port: 9000
      targetPort: 9000
      nodePort: {{ .Values.service.ports.http }}
    - name: dashboard
      protocol: TCP
      port: 9001
      targetPort: 9001
      nodePort: {{ .Values.service.ports.dashboard }}
