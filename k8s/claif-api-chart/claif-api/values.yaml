replicaCount: 1
secretName: "claif-api-secrets"
claifDbSecretName: "claif-db-secrets"
keycloakSecretName: "keycloak-secrets"
minioSecretName: "minio-secrets"
minioServerEndpoint: "minio:9000"
claifTranscriberEndpoint: "http://claif-transcriber:8000"
containerPort: 8000
command: "./scripts/wait_for_db.sh claif-db:5432 && ./scripts/wait_for_keycloak.sh keycloak \
  && ./scripts/wait_for_minio.sh minio:9000 && poetry run uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1"

service:
  type: NodePort
  port: 8000
  targetPort: 8000
  nodePort: 30082
